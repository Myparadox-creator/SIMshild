plugins { id 'com.android.application' }

android { 
    namespace 'com.simshield.protection'
    compileSdk 35

    defaultConfig { 
        applicationId 'com.simshield.protection'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'RISK_API_BASE_URL', '"' + (project.findProperty('RISK_API_BASE_URL') ?: '') + '"' 
    }

    buildFeatures { 
        buildConfig true 
    }
}
